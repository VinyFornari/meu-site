backend:
  name: github
  repo: VinyFornari/meu-site
  branch: main
  auth_type: pkce
  app_id: Ov23limECNG5fH1QGxPu

media_folder: "src/content/uploads"
public_folder: "/content/uploads"

collections:
  - name: "posts"
    label: "Artigos do Blog"
    label_singular: "Artigo"
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Subtítulo", name: "subtitle", widget: "string", required: false }
      - { label: "Slug (URL)", name: "slug", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - label: "Categoria"
        name: "category"
        widget: "select"
        options: ["Vendas","Marketing","Gestão","Liderança","Inteligência Artificial","Negócios","Tecnologia","Empreendedorismo"]
      - { label: "Tempo de leitura (min)", name: "readingTime", widget: "number", value_type: "int", min: 1, max: 60, default: 5, required: false }
      - { label: "Imagem de capa (opcional)", name: "cover", widget: "image", required: false }
      - { label: "Conteúdo", name: "body", widget: "markdown" }
