name: Atualiza posts.json

on:
  push:
    branches: [main]
    paths:
      - 'src/content/posts/**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild posts.json
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');

          const POSTS_DIR = 'src/content/posts';
          const OUT_FILE  = 'src/content/posts.json';

          function parseFrontMatter(text) {
            const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---/);
            if (!m) return {};
            const meta = {};
            m[1].split(/\r?\n/).forEach(line => {
              const i = line.indexOf(':');
              if (i === -1) return;
              const key = line.slice(0, i).trim();
              let val = line.slice(i + 1).trim();
              if (val.startsWith('\"') && val.endsWith('\"')) val = val.slice(1, -1);
              if (val.startsWith(\"'\") && val.endsWith(\"'\")) val = val.slice(1, -1);
              if (/^-?\d+\$/.test(val)) val = parseInt(val, 10);
              meta[key] = val;
            });
            return meta;
          }

          if (!fs.existsSync(POSTS_DIR)) {
            console.log('No posts directory yet.');
            fs.writeFileSync(OUT_FILE, JSON.stringify({ posts: [] }, null, 2));
            process.exit(0);
          }

          const files = fs.readdirSync(POSTS_DIR).filter(f => f.endsWith('.md'));
          const posts = files.map(f => {
            const txt = fs.readFileSync(path.join(POSTS_DIR, f), 'utf-8');
            const meta = parseFrontMatter(txt);
            return {
              slug:        meta.slug || f.replace(/\.md\$/, ''),
              title:       meta.title || '',
              subtitle:    meta.subtitle || '',
              date:        meta.date || '',
              category:    meta.category || '',
              readingTime: meta.readingTime || 5,
              cover:       meta.cover || ''
            };
          }).filter(p => p.title);

          posts.sort((a, b) => new Date(b.date) - new Date(a.date));

          fs.writeFileSync(OUT_FILE, JSON.stringify({ posts }, null, 2) + '\n');
          console.log('Wrote ' + posts.length + ' post(s) to ' + OUT_FILE);
          "

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain src/content/posts.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/content/posts.json
            git commit -m "chore: atualiza posts.json automaticamente"
            git push
          else
            echo "posts.json já está atualizado."
