name: Atualiza posts.json

on:
  push:
    branches: [main]
    paths:
      - 'src/content/posts/**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Rebuild posts.json
        run: node scripts/build-posts.js

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain src/content/posts.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/content/posts.json
            git commit -m "chore: atualiza posts.json automaticamente"
            git push
          else
            echo "posts.json ja esta atualizado."
          fi
